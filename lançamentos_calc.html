<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelo Lançamentos Laterais</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card2: #21253a;
    --accent: #4f8ef7;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #facc15;
    --orange: #f97316;
    --text: #e2e8f0;
    --muted: #64748b;
    --border: #2d3348;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; padding: 24px 16px; }

  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 6px; letter-spacing: -0.5px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 28px; }

  /* Liga tabs */
  .liga-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
  .liga-tab {
    padding: 8px 22px; border-radius: 999px; border: 2px solid var(--border);
    background: var(--card); color: var(--muted); cursor: pointer; font-size: 0.9rem;
    font-weight: 600; transition: all .2s;
  }
  .liga-tab:hover { border-color: var(--accent); color: var(--text); }
  .liga-tab.active { border-color: var(--accent); background: var(--accent); color: #fff; }

  /* Form */
  .form-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.span2 { grid-column: span 2; }
  label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  select, input[type=number], input[type=text] {
    background: var(--card2); border: 1.5px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 14px; font-size: 0.95rem; width: 100%;
    transition: border-color .2s; appearance: none;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }

  /* 3-col para linha/odd/casa */
  .form-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 16px; }

  .btn-calc {
    width: 100%; padding: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700;
    cursor: pointer; margin-top: 20px; transition: background .2s, transform .1s;
    letter-spacing: 0.02em;
  }
  .btn-calc:hover { background: #3a7ef5; transform: translateY(-1px); }
  .btn-calc:active { transform: translateY(0); }

  /* Results */
  #result { display: none; }
  .result-header { text-align: center; margin-bottom: 20px; }
  .matchup { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
  .matchup span { color: var(--accent); }

  /* Signal badge */
  .signal-badge {
    display: inline-block; padding: 6px 20px; border-radius: 999px;
    font-size: 1rem; font-weight: 800; letter-spacing: 0.04em; margin: 8px 0;
  }
  .sig-over-forte   { background: rgba(34,197,94,.15); color: var(--green); border: 2px solid var(--green); }
  .sig-over-mod     { background: rgba(250,204,21,.1); color: var(--yellow); border: 2px solid var(--yellow); }
  .sig-under-forte  { background: rgba(239,68,68,.15); color: var(--red); border: 2px solid var(--red); }
  .sig-under-mod    { background: rgba(249,115,22,.12); color: var(--orange); border: 2px solid var(--orange); }
  .sig-neutro       { background: rgba(100,116,139,.12); color: var(--muted); border: 2px solid var(--border); }

  /* Stats grid */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-box {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; text-align: center;
  }
  .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .stat-val { font-size: 1.6rem; font-weight: 800; }
  .stat-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

  /* Prob bar */
  .prob-section { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .prob-title { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .prob-bar-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .prob-bar-label { width: 90px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .prob-bar-bg { flex: 1; background: var(--border); border-radius: 999px; height: 14px; overflow: hidden; }
  .prob-bar-fill { height: 100%; border-radius: 999px; transition: width .6s ease; }
  .prob-bar-pct { width: 52px; font-size: 0.95rem; font-weight: 700; text-align: right; }
  .fill-over { background: linear-gradient(90deg, var(--green), #16a34a); }
  .fill-under { background: linear-gradient(90deg, var(--red), #b91c1c); }

  /* Teams averages */
  .teams-section { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .team-card { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .team-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; }
  .team-casa { color: var(--accent); }
  .team-fora { color: var(--orange); }
  .team-stat { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .team-stat:last-child { border-bottom: none; }
  .team-stat-val { font-weight: 600; }

  /* IC */
  .ic-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .ic-box { flex: 1; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; text-align: center; }
  .ic-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .ic-val { font-size: 1rem; font-weight: 700; margin-top: 4px; }

  /* Model info */
  .model-info { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
  .info-chip { background: var(--card2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px; font-size: 0.78rem; color: var(--muted); }

  .verde { color: var(--green); }
  .vermelho { color: var(--red); }
  .amarelo { color: var(--yellow); }

  /* Registar botão */
  .btn-registar {
    width: 100%; padding: 13px; background: transparent;
    color: var(--green); border: 2px solid var(--green); border-radius: 10px;
    font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 12px;
    transition: all .2s; letter-spacing: 0.02em;
  }
  .btn-registar:hover { background: var(--green); color: #000; }
  .btn-registar:disabled { opacity: .4; cursor: not-allowed; }

  /* Secção de registo */
  .log-section { margin-top: 32px; }
  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .log-title { font-size: 1.1rem; font-weight: 700; }
  .log-count { font-size: 0.8rem; color: var(--muted); background: var(--card2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 12px; }

  .btn-export {
    padding: 9px 20px; background: #16a34a; color: #fff; border: none;
    border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
    transition: background .2s;
  }
  .btn-export:hover { background: #15803d; }
  .btn-clear {
    padding: 9px 16px; background: transparent; color: var(--red);
    border: 1.5px solid var(--red); border-radius: 8px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .btn-clear:hover { background: var(--red); color: #fff; }

  .log-table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th { background: var(--card2); color: var(--muted); font-size: 0.72rem; text-transform: uppercase;
       letter-spacing: 0.06em; padding: 10px 12px; text-align: left; white-space: nowrap; }
  td { padding: 9px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
  tr:hover td { background: var(--card2); }
  .td-signal { font-weight: 700; font-size: 0.78rem; }
  .td-del { color: var(--muted); cursor: pointer; font-size: 1rem; }
  .td-del:hover { color: var(--red); }
  .empty-log { text-align: center; color: var(--muted); padding: 32px; font-size: 0.9rem; }

  /* Resultado */
  .resultado-tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  .res-win  { background: rgba(34,197,94,.15); color: var(--green); }
  .res-loss { background: rgba(239,68,68,.15); color: var(--red); }
  .res-open { background: rgba(100,116,139,.12); color: var(--muted); }
  select.res-select { padding: 3px 6px; font-size: 0.78rem; width: auto; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .span2 { grid-column: span 1; }
    .form-3 { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .teams-section { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚽ Modelo Lançamentos Laterais</h1>
  <p class="subtitle">PL · PPL · Brasileirão &nbsp;|&nbsp; Dados 2025/26</p>

  <!-- Liga -->
  <div class="liga-tabs">
    <button class="liga-tab active" data-liga="PL">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
    <button class="liga-tab" data-liga="PPL">🇵🇹 Primeira Liga</button>
    <button class="liga-tab" data-liga="BRA">🇧🇷 Brasileirão</button>
  </div>

  <!-- Form -->
  <div class="form-card">
    <div class="form-grid">
      <div class="form-group">
        <label>🏠 Casa</label>
        <select id="selHome"></select>
      </div>
      <div class="form-group">
        <label>✈️ Fora</label>
        <select id="selAway"></select>
      </div>
    </div>
    <div class="form-3">
      <div class="form-group">
        <label>📊 Linha</label>
        <input type="number" id="inpLinha" placeholder="ex: 35.5" step="0.5" min="20" max="60">
      </div>
      <div class="form-group">
        <label>💰 Odd Over</label>
        <input type="number" id="inpOdd" placeholder="ex: 1.85" step="0.01" min="1" max="10">
      </div>
      <div class="form-group">
        <label>🏦 Casa de Apostas</label>
        <select id="selBookie">
          <option value="22bet">22bet</option>
          <option value="Betano">Betano</option>
          <option value="Bet365">Bet365</option>
          <option value="Solverde">Solverde</option>
          <option value="Placard">Placard</option>
          <option value="Outra">Outra</option>
        </select>
      </div>
    </div>
    <button class="btn-calc" onclick="calcular()">▶ CALCULAR</button>
  </div>

  <!-- Resultado -->
  <div id="result">
    <div class="result-header">
      <div class="matchup" id="rMatchup"></div>
      <div id="rSignal"></div>
      <div style="color:var(--muted);font-size:0.82rem;margin-top:4px" id="rBookie"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Modelo prevê</div>
        <div class="stat-val" id="rPred">—</div>
        <div class="stat-sub">lançamentos</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Linha bookmaker</div>
        <div class="stat-val" id="rLinha">—</div>
        <div class="stat-sub" id="rDiff">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Média liga</div>
        <div class="stat-val" id="rMedia">—</div>
        <div class="stat-sub">histórico</div>
      </div>
    </div>

    <!-- Probabilidades -->
    <div class="prob-section">
      <div class="prob-title">Probabilidades</div>
      <div class="prob-bar-wrap">
        <div class="prob-bar-label verde">OVER</div>
        <div class="prob-bar-bg"><div class="prob-bar-fill fill-over" id="barOver" style="width:0%"></div></div>
        <div class="prob-bar-pct verde" id="pOver">—</div>
      </div>
      <div class="prob-bar-wrap">
        <div class="prob-bar-label vermelho">UNDER</div>
        <div class="prob-bar-bg"><div class="prob-bar-fill fill-under" id="barUnder" style="width:0%"></div></div>
        <div class="prob-bar-pct vermelho" id="pUnder">—</div>
      </div>
    </div>

    <!-- IC -->
    <div class="ic-row">
      <div class="ic-box"><div class="ic-label">IC 68%</div><div class="ic-val" id="ic68">—</div></div>
      <div class="ic-box"><div class="ic-label">IC 90%</div><div class="ic-val" id="ic90">—</div></div>
      <div class="ic-box"><div class="ic-label">Odd justa</div><div class="ic-val" id="rOddJusta">—</div></div>
      <div class="ic-box"><div class="ic-label">Value</div><div class="ic-val" id="rValue">—</div></div>
    </div>

    <!-- Médias das equipas -->
    <div class="teams-section">
      <div class="team-card">
        <div class="team-name team-casa" id="rHomeName">—</div>
        <div id="rHomeStats"></div>
      </div>
      <div class="team-card">
        <div class="team-name team-fora" id="rAwayName">—</div>
        <div id="rAwayStats"></div>
      </div>
    </div>

    <!-- Info modelo -->
    <div class="model-info">
      <div class="info-chip" id="infoR2">R² —</div>
      <div class="info-chip" id="infoMAE">MAE —</div>
      <div class="info-chip" id="infoSigma">σ —</div>
      <div class="info-chip" id="infoN">N —</div>
    </div>

    <!-- Botões ação -->
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn-registar" id="btnRegistar" onclick="registarEntrada()" style="flex:1">
        📝 Registar Entrada
      </button>
      <a href="lançamentos_registo.html" style="flex:0 0 auto;padding:13px 20px;background:var(--card2);color:var(--muted);border:2px solid var(--border);border-radius:10px;font-size:0.9rem;font-weight:700;text-decoration:none;display:flex;align-items:center;white-space:nowrap">
        📋 Ver Registo
      </a>
    </div>

  </div>

</div>

function normCDF(x) {
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x) / Math.sqrt(2);
  const t = 1.0/(1.0 + p*x);
  const y = 1.0 - (((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return 0.5*(1.0 + sign*y);
}

// ─────────────────────────────────────────────────────────────
// Predição
// ─────────────────────────────────────────────────────────────
function predict(liga, homeTeam, awayTeam) {
  const m = MODELS[liga];
  const hData = m.teams[homeTeam];
  const aData = m.teams[awayTeam];

  // Mapeamento feat_col → valor
  const featMap = {
    'H_Alívios_casa':       hData['Alívios_casa']       || m.scaler_mean[0],
    'H_Passes longos_casa': hData['Passes longos_casa'] || m.scaler_mean[1],
    'H_Cruzamentos_casa':   hData['Cruzamentos_casa']   || m.scaler_mean[2],
    'H_Posse de bola_casa': hData['Posse de bola_casa'] || m.scaler_mean[3],
    'H_Lançamentos_casa':   hData['Lançamentos_casa']   || m.scaler_mean[4],
    'H_Faltas_fora':        hData['Faltas_fora']        || m.scaler_mean[5],
    'H_Interceções_fora':   hData['Interceções_fora']   || m.scaler_mean[6],
    'H_Desarmes_fora':      hData['Desarmes_fora']      || m.scaler_mean[7],
    'A_Alívios_fora':       aData['Alívios_fora']       || m.scaler_mean[8],
    'A_Passes longos_fora': aData['Passes longos_fora'] || m.scaler_mean[9],
    'A_Cruzamentos_fora':   aData['Cruzamentos_fora']   || m.scaler_mean[10],
    'A_Posse de bola_fora': aData['Posse de bola_fora'] || m.scaler_mean[11],
    'A_Lançamentos_fora':   aData['Lançamentos_fora']   || m.scaler_mean[12],
    'A_Faltas_casa':        aData['Faltas_casa']        || m.scaler_mean[13],
    'A_Interceções_casa':   aData['Interceções_casa']   || m.scaler_mean[14],
    'A_Desarmes_casa':      aData['Desarmes_casa']      || m.scaler_mean[15],
  };

  let pred = m.intercept;
  m.feat_cols.forEach((fc, i) => {
    const raw = featMap[fc] || m.scaler_mean[i];
    const scaled = (raw - m.scaler_mean[i]) / m.scaler_scale[i];
    pred += m.coef[i] * scaled;
  });
  return Math.max(pred, 15);
}

// ─────────────────────────────────────────────────────────────
// UI — poblar equipas
// ─────────────────────────────────────────────────────────────
function updateTeams() {
  const teams = Object.keys(MODELS[ligaAtual].teams).sort();
  const home = document.getElementById('selHome');
  const away = document.getElementById('selAway');
  home.innerHTML = teams.map(t => `<option>${t}</option>`).join('');
  away.innerHTML = teams.map(t => `<option>${t}</option>`).join('');
  if (teams.length > 1) away.selectedIndex = 1;
  document.getElementById('result').style.display = 'none';
}

document.querySelectorAll('.liga-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.liga-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ligaAtual = btn.dataset.liga;
    updateTeams();
  });
});

// ─────────────────────────────────────────────────────────────
// Calcular
// ─────────────────────────────────────────────────────────────
function calcular() {
  const home   = document.getElementById('selHome').value;
  const away   = document.getElementById('selAway').value;
  const linha  = parseFloat(document.getElementById('inpLinha').value);
  const odd    = parseFloat(document.getElementById('inpOdd').value);
  const bookie = document.getElementById('selBookie').value;
  const m      = MODELS[ligaAtual];

  if (home === away) { alert('Escolhe equipas diferentes!'); return; }
  if (!linha || linha <= 0) { alert('Insere a linha!'); return; }

  const pred = predict(ligaAtual, home, away);
  const std  = m.std_resid;
  const diff = pred - linha;

  // IC
  const ic68lo = pred - std,       ic68hi = pred + std;
  const ic90lo = pred - 1.645*std, ic90hi = pred + 1.645*std;

  // Probabilidades
  const pOver  = (1 - normCDF((linha - pred) / std)) * 100;
  const pUnder = 100 - pOver;

  // Odd justa & value
  const oddJusta = pOver > 0 ? (100 / pOver).toFixed(2) : '—';
  const value = !isNaN(odd) && pOver > 0 ? ((odd * pOver/100 - 1)*100).toFixed(1) : null;

  // Signal
  let signal, sigClass;
  if (diff > 4)       { signal = '🟢 OVER FORTE';        sigClass = 'sig-over-forte'; }
  else if (diff > 2)  { signal = '🟡 OVER MODERADO';     sigClass = 'sig-over-mod'; }
  else if (diff < -4) { signal = '🔴 UNDER FORTE';       sigClass = 'sig-under-forte'; }
  else if (diff < -2) { signal = '🟠 UNDER MODERADO';    sigClass = 'sig-under-mod'; }
  else                { signal = '⚪ SEM EDGE';           sigClass = 'sig-neutro'; }

  // ── Preencher UI ──────────────────────────────────────────
  document.getElementById('rMatchup').innerHTML =
    `<span>${home}</span> 🏠 vs ✈ <span>${away}</span>`;
  document.getElementById('rSignal').innerHTML =
    `<span class="signal-badge ${sigClass}">${signal}</span>`;
  document.getElementById('rBookie').textContent = `${bookie} · Linha ${linha} · Over @${odd || '—'}`;

  document.getElementById('rPred').textContent  = pred.toFixed(1);
  document.getElementById('rPred').style.color  = diff > 2 ? 'var(--green)' : diff < -2 ? 'var(--red)' : 'var(--text)';
  document.getElementById('rLinha').textContent = linha.toFixed(1);
  document.getElementById('rDiff').textContent  = `${diff >= 0 ? '+' : ''}${diff.toFixed(1)} vs linha`;
  document.getElementById('rMedia').textContent = m.mu_global.toFixed(1);

  // Prob bars
  document.getElementById('pOver').textContent   = pOver.toFixed(1) + '%';
  document.getElementById('pUnder').textContent  = pUnder.toFixed(1) + '%';
  setTimeout(() => {
    document.getElementById('barOver').style.width  = Math.min(pOver,100) + '%';
    document.getElementById('barUnder').style.width = Math.min(pUnder,100) + '%';
  }, 50);

  // IC
  document.getElementById('ic68').textContent = `${ic68lo.toFixed(0)} – ${ic68hi.toFixed(0)}`;
  document.getElementById('ic90').textContent = `${ic90lo.toFixed(0)} – ${ic90hi.toFixed(0)}`;
  document.getElementById('rOddJusta').textContent = oddJusta;
  if (value !== null) {
    const vNum = parseFloat(value);
    document.getElementById('rValue').textContent = (vNum >= 0 ? '+' : '') + value + '%';
    document.getElementById('rValue').style.color = vNum >= 5 ? 'var(--green)' : vNum >= 0 ? 'var(--yellow)' : 'var(--red)';
  } else {
    document.getElementById('rValue').textContent = '—';
  }

  // Teams stats
  const hData = m.teams[home];
  const aData = m.teams[away];
  document.getElementById('rHomeName').textContent = `🏠 ${home} (casa)`;
  document.getElementById('rAwayName').textContent = `✈ ${away} (fora)`;

  const hStats = [
    ['Lançamentos/j', hData['Lançamentos_casa']?.toFixed(1)],
    ['Passes longos', hData['Passes longos_casa']?.toFixed(1)],
    ['Alívios',       hData['Alívios_casa']?.toFixed(1)],
    ['Posse de bola', hData['Posse de bola_casa']?.toFixed(1) + '%'],
    ['Cruzamentos',   hData['Cruzamentos_casa']?.toFixed(1)],
    ['Faltas sofridas',hData['Faltas_fora']?.toFixed(1)],
  ];
  const aStats = [
    ['Lançamentos/j', aData['Lançamentos_fora']?.toFixed(1)],
    ['Passes longos', aData['Passes longos_fora']?.toFixed(1)],
    ['Alívios',       aData['Alívios_fora']?.toFixed(1)],
    ['Posse de bola', aData['Posse de bola_fora']?.toFixed(1) + '%'],
    ['Cruzamentos',   aData['Cruzamentos_fora']?.toFixed(1)],
    ['Faltas sofridas',aData['Faltas_casa']?.toFixed(1)],
  ];

  document.getElementById('rHomeStats').innerHTML = hStats.map(([l,v]) =>
    `<div class="team-stat"><span>${l}</span><span class="team-stat-val">${v||'—'}</span></div>`).join('');
  document.getElementById('rAwayStats').innerHTML = aStats.map(([l,v]) =>
    `<div class="team-stat"><span>${l}</span><span class="team-stat-val">${v||'—'}</span></div>`).join('');

  // Info modelo
  document.getElementById('infoR2').textContent  = `R² ${m.r2.toFixed(3)}`;
  document.getElementById('infoMAE').textContent = `MAE ${m.mae_cv.toFixed(2)}`;
  document.getElementById('infoSigma').textContent = `σ ${m.std_resid.toFixed(2)}`;
  document.getElementById('infoN').textContent   = ligaAtual === 'PL' ? 'N 380' : ligaAtual === 'PPL' ? 'N 308' : 'N 380';

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});

  // Guardar estado para botão Registar
  ultimoCalculo = {
    liga: ligaAtual, home, away, pred: parseFloat(pred.toFixed(1)),
    linha, diff: parseFloat(diff.toFixed(1)), signal,
    pOver: parseFloat(pOver.toFixed(1)), pUnder: parseFloat(pUnder.toFixed(1)),
    odd: isNaN(odd) ? '' : odd,
    oddJusta: (pOver > 0 ? (100/pOver).toFixed(2) : ''),
    value: value !== null ? value : '',
    bookie,
  };
}

// ─────────────────────────────────────────────────────────────
// Estado do último cálculo (para registar)
// ─────────────────────────────────────────────────────────────
let ultimoCalculo = null;

// ─────────────────────────────────────────────────────────────
// localStorage — registo de entradas
// ─────────────────────────────────────────────────────────────
const STORE_KEY = 'lancamentos_entradas_v1';

function carregarEntradas() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
  catch { return []; }
}
function guardarEntradas(arr) {
  localStorage.setItem(STORE_KEY, JSON.stringify(arr));
}

// ─────────────────────────────────────────────────────────────
// Registar entrada atual
// ─────────────────────────────────────────────────────────────
function registarEntrada() {
  if (!ultimoCalculo) return;
  const entradas = carregarEntradas();
  const now = new Date();
  const entrada = {
    id:        Date.now(),
    data:      now.toLocaleDateString('pt-PT'),
    hora:      now.toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'}),
    liga:      ultimoCalculo.liga,
    casa:      ultimoCalculo.home,
    fora:      ultimoCalculo.away,
    modelo:    ultimoCalculo.pred,
    linha:     ultimoCalculo.linha,
    diff:      parseFloat((ultimoCalculo.pred - ultimoCalculo.linha).toFixed(1)),
    signal:    ultimoCalculo.signal,
    pOver:     ultimoCalculo.pOver,
    pUnder:    ultimoCalculo.pUnder,
    odd:       ultimoCalculo.odd || '',
    oddJusta:  ultimoCalculo.oddJusta || '',
    value:     ultimoCalculo.value || '',
    bookie:    ultimoCalculo.bookie,
    resultado: 'Aberta',
  };
  entradas.unshift(entrada);
  guardarEntradas(entradas);
  registarEntradaFeedback();
}

// feedback botão registar
function registarEntradaFeedback() {
  const btn = document.getElementById('btnRegistar');
  btn.textContent = '✅ Registado!';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = '📝 Registar Entrada'; btn.disabled = false; }, 2000);
}

// init
updateTeams();
</script>
